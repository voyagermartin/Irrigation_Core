<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- 防搜尋引擎與爬蟲收錄 -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  
  <title>Irrigation_Core 資金調度系統</title>
  
  <!-- 感覺會賺錢的 App 圖示與 Favicon -->
  <link rel="icon" type="image/png" href="https://voyagermartin.github.io/Irrigation_Core/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://voyagermartin.github.io/Irrigation_Core/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Irrigation">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --income-color: #10b981;
      --expense-color: #ef4444;
      --transfer-color: #06b6d4;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.15);
      --input-focus: #818cf8;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Header Styling */
    .app-header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 8px;
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .app-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Main Card Container */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    /* Mode Selector Tabs */
    .mode-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      gap: 3px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px 4px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    /* Quick Chips for Common Items */
    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip-btn {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      font-size: 0.775rem;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .chip-btn:hover, .chip-btn:active {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--accent-primary);
      color: #e0e7ff;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field, .select-field {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .select-field option {
      background: #1e293b;
      color: #f8fafc;
    }

    .input-field:focus, .select-field:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
    }

    /* Type Switcher (Single Mode) */
    .type-switcher {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .type-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      background: var(--input-bg);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .type-btn.active[data-type="expense"] {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--expense-color);
      color: #fca5a5;
    }

    .type-btn.active[data-type="income"] {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--income-color);
      color: #6ee7b7;
    }

    /* Section Cards for Transfer Mode */
    .account-section {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .account-section-title {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .account-section-title.from {
      color: #fca5a5;
    }

    .account-section-title.to {
      color: #6ee7b7;
    }

    .select-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    /* Amount Input Group */
    .amount-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .amount-prefix {
      position: absolute;
      left: 14px;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 1.1rem;
    }

    .amount-input {
      padding-left: 36px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: all 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Loading Overlay / Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.success {
      border-color: rgba(16, 185, 129, 0.4);
    }

    .toast.error {
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Balance Badge for Input Forms */
    .balance-badge {
      margin-top: 8px;
      padding: 6px 12px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(129, 140, 248, 0.25);
      border-radius: var(--radius-sm);
      font-size: 0.825rem;
      color: #a5b4fc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .balance-badge-val {
      font-weight: 700;
      color: #34d399;
      font-size: 0.9rem;
    }

    .balance-badge-val.negative {
      color: #fca5a5;
    }

    /* Total Net Worth Card */
    .total-worth-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(99, 102, 241, 0.15) 100%);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .total-worth-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .total-worth-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .refresh-btn:active {
      transform: scale(0.9);
    }

    .total-worth-amount {
      font-size: 1.75rem;
      font-weight: 800;
      color: #34d399;
      letter-spacing: -0.5px;
    }

    /* Filter Section in Balance View */
    .filter-section {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 16px;
    }

    .filter-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    /* Balance List Cards */
    .balance-list-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .balance-item-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .balance-item-card:hover {
      border-color: rgba(129, 140, 248, 0.3);
      background: rgba(30, 41, 59, 0.8);
    }

    .balance-item-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .balance-item-bank {
      font-size: 0.925rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .balance-item-meta {
      font-size: 0.775rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .tag-account {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.725rem;
      font-weight: 600;
    }

    .tag-purpose {
      background: rgba(6, 182, 212, 0.2);
      color: #67e8f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.725rem;
      font-weight: 600;
    }

    .balance-item-right {
      text-align: right;
    }

    .balance-item-val {
      font-size: 1.1rem;
      font-weight: 700;
      color: #34d399;
    }

    .balance-item-val.negative {
      color: #fca5a5;
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* Main Top Tabs */
    .main-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.85);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25);
      gap: 4px;
    }

    .main-tab-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }

    .main-tab-btn.active {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    /* History View Styles */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .history-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .history-subtitle {
      font-size: 0.775rem;
      color: var(--text-secondary);
    }

    .history-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      gap: 12px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .history-spinner {
      width: 28px;
      height: 28px;
      border-width: 3px;
      border-top-color: var(--accent-primary);
    }

    .history-list-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tx-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 13px 15px;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tx-card:hover {
      border-color: rgba(129, 140, 248, 0.3);
      background: rgba(30, 41, 59, 0.8);
    }

    .tx-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tx-date-badge {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tx-type-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .tx-type-tag.income {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .tx-type-tag.expense {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .tx-amount {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .tx-amount.income {
      color: #34d399;
    }

    .tx-amount.expense {
      color: #f87171;
    }

    .tx-account-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.875rem;
      color: var(--text-primary);
      font-weight: 600;
    }

    .tx-desc-row {
      font-size: 0.825rem;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.4);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--accent-primary);
      word-break: break-word;
    }

    /* Helper utility classes */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="app-header">
      <h1 class="app-title">Irrigation_Core</h1>
      <p class="app-subtitle">個人自動化資產與資金調度系統</p>
    </div>

    <div class="card">
      <!-- 頂部頁籤切換：新增記帳 vs 餘額查詢 vs 查詢紀錄 -->
      <div class="main-tabs">
        <button type="button" class="main-tab-btn active" id="tab-nav-record" onclick="switchNavTab('record')">
          <span>📝 新增記帳</span>
        </button>
        <button type="button" class="main-tab-btn" id="tab-nav-balance" onclick="switchNavTab('balance')">
          <span>💎 餘額查詢</span>
        </button>
        <button type="button" class="main-tab-btn" id="tab-nav-history" onclick="switchNavTab('history')">
          <span>📜 查詢紀錄</span>
        </button>
      </div>

      <!-- ================= 區塊一：新增記帳 ================= -->
      <div id="panel-record">
        <!-- 模式切換 -->
        <div class="mode-tabs">
          <button type="button" class="tab-btn active" id="tab-single" onclick="switchMode('single')">單筆記帳</button>
          <button type="button" class="tab-btn" id="tab-transfer" onclick="switchMode('transfer')">資金平移</button>
          <button type="button" class="tab-btn" id="tab-credit" onclick="switchMode('credit')">刷卡</button>
        </div>

        <!-- ================= 交易記帳 表單 ================= -->
        <form id="tx-form" onsubmit="handleFormSubmit(event)">
        <!-- 交易日期 -->
        <div class="form-group" id="tx-date-group">
          <label class="form-label" for="tx-date">交易日期</label>
          <input type="date" id="tx-date" class="input-field" required>
        </div>

        <!-- ================= 單筆記帳 模式表單 ================= -->
        <div id="single-mode-fields">
          <div class="form-group">
            <label class="form-label">交易類型</label>
            <div class="type-switcher">
              <button type="button" class="type-btn active" data-type="expense" onclick="switchType('expense')">支出 (-)</button>
              <button type="button" class="type-btn" data-type="income" onclick="switchType('income')">收入 (+)</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">選擇帳戶 (銀行 / 類別 / 名目)</label>
            <div class="select-grid">
              <select id="single-bank" class="select-field" onchange="onSingleBankChange()" required>
                <option value="">讀取銀行中...</option>
              </select>
              <select id="single-account" class="select-field" onchange="onSingleAccountChange()" required disabled>
                <option value="">選擇戶頭</option>
              </select>
            </div>
            <select id="single-purpose" class="select-field" style="margin-top: 8px;" onchange="onSinglePurposeChange()" required disabled>
              <option value="">選擇名目用途</option>
            </select>
            <div id="single-balance-badge" class="balance-badge hidden">
              <span>當前餘額</span>
              <span id="single-balance-val" class="balance-badge-val">$0</span>
            </div>
          </div>
        </div>

        <!-- ================= 資金平移 模式表單 ================= -->
        <div id="transfer-mode-fields" class="hidden">
          <!-- 轉出帳戶 -->
          <div class="account-section">
            <div class="account-section-title from">
              <span>📤 轉出帳戶 (扣款)</span>
            </div>
            <div class="select-grid">
              <select id="from-bank" class="select-field" onchange="onFromBankChange()">
                <option value="">讀取銀行中...</option>
              </select>
              <select id="from-account" class="select-field" onchange="onFromAccountChange()" disabled>
                <option value="">選擇戶頭</option>
              </select>
            </div>
            <select id="from-purpose" class="select-field" style="margin-top: 8px;" onchange="onFromPurposeChange()" disabled>
              <option value="">選擇名目用途</option>
            </select>
            <div id="from-balance-badge" class="balance-badge hidden">
              <span>當前餘額</span>
              <span id="from-balance-val" class="balance-badge-val">$0</span>
            </div>
          </div>

          <!-- 轉入帳戶 -->
          <div class="account-section">
            <div class="account-section-title to">
              <span>📥 轉入帳戶 (撥入)</span>
            </div>
            <div class="select-grid">
              <select id="to-bank" class="select-field" onchange="onToBankChange()">
                <option value="">讀取銀行中...</option>
              </select>
              <select id="to-account" class="select-field" onchange="onToAccountChange()" disabled>
                <option value="">選擇戶頭</option>
              </select>
            </div>
            <select id="to-purpose" class="select-field" style="margin-top: 8px;" onchange="onToPurposeChange()" disabled>
              <option value="">選擇名目用途</option>
            </select>
            <div id="to-balance-badge" class="balance-badge hidden">
              <span>當前餘額</span>
              <span id="to-balance-val" class="balance-badge-val">$0</span>
            </div>
          </div>
        </div>

        <!-- ================= 信用卡刷卡 模式表單 ================= -->
        <div id="credit-mode-fields" class="hidden">
          <div class="form-group">
            <label class="form-label">選擇卡片 (發卡銀行 / 卡片)</label>
            <div class="select-grid">
              <select id="cc-bank" class="select-field" onchange="onCcBankChange()">
                <option value="">選擇發卡銀行</option>
              </select>
              <select id="cc-card" class="select-field" disabled>
                <option value="">選擇卡片</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="cc-channel">支付通道</label>
            <select id="cc-channel" class="select-field">
              <option value="實體刷卡">實體刷卡</option>
              <option value="LINE Pay">LINE Pay</option>
              <option value="街口支付">街口支付</option>
              <option value="Apple Pay">Apple Pay</option>
              <option value="悠遊卡/一卡通">悠遊卡/一卡通</option>
              <option value="網路購物">網路購物</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="cc-item">消費項目</label>
            <select id="cc-item" class="select-field">
              <option value="">請選擇消費項目</option>
              <option value="悠遊卡加值">悠遊卡加值</option>
              <option value="台鐵票">台鐵票</option>
              <option value="高鐵票">高鐵票</option>
              <option value="超商消費">超商消費</option>
              <option value="外食餐飲">外食餐飲</option>
              <option value="日常用品">日常用品</option>
              <option value="生鮮超市">生鮮超市</option>
              <option value="加油">加油</option>
              <option value="訂閱服務">訂閱服務</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="cc-purpose">對應扣款名目 (選填)</label>
            <select id="cc-purpose" class="select-field">
              <option value="">預設扣款戶 / 依卡片設定</option>
            </select>
          </div>
        </div>

        <!-- 金額 -->
        <div class="form-group" id="tx-amount-group">
          <label class="form-label" for="tx-amount">交易金額</label>
          <div class="amount-input-wrapper">
            <span class="amount-prefix">$</span>
            <input type="number" id="tx-amount" class="input-field amount-input" placeholder="0" min="1" step="any" required>
          </div>
        </div>

        <!-- 項目說明 -->
        <div class="form-group" id="tx-desc-group">
          <label class="form-label" for="tx-desc" id="tx-desc-label">交易項目說明 (選填)</label>
          <input type="text" id="tx-desc" class="input-field" placeholder="例如：7月利息 / 儲蓄提撥">
        </div>

        <!-- 送出按鈕 -->
        <button type="submit" id="submit-btn" class="submit-btn">
          <span id="btn-text">確認寫入交易</span>
          <div id="btn-spinner" class="spinner hidden"></div>
        </button>
      </form>
      </div>

      <!-- ================= 區塊二：餘額查詢 ================= -->
      <div id="panel-balance" class="hidden">
        <!-- 總資產淨值卡片 -->
        <div class="total-worth-card">
          <div class="total-worth-header">
            <span class="total-worth-title">💎 總資產淨值</span>
            <button type="button" class="refresh-btn" onclick="refreshBalances()" title="重新整理餘額">
              <span id="refresh-icon">🔄</span>
            </button>
          </div>
          <div class="total-worth-amount" id="total-net-worth">$0</div>
        </div>

        <!-- 三階連動篩選器 -->
        <div class="filter-section">
          <div class="filter-title">🔍 篩選帳戶 (銀行 / 戶頭 / 名目)</div>
          <div class="select-grid">
            <select id="filter-bank" class="select-field" onchange="onFilterBankChange()">
              <option value="">全部銀行</option>
            </select>
            <select id="filter-account" class="select-field" onchange="onFilterAccountChange()">
              <option value="">全部戶頭</option>
            </select>
          </div>
          <select id="filter-purpose" class="select-field" style="margin-top: 8px;" onchange="renderBalanceList()">
            <option value="">全部名目用途</option>
          </select>
        </div>

        <!-- 帳戶餘額卡片清單 -->
        <div id="balance-list-container" class="balance-list-container">
          <!-- 由 JS 動態生成 -->
        </div>
      </div>

      <!-- ================= 區塊三：查詢交易紀錄 ================= -->
      <div id="panel-history" class="hidden">
        <div class="history-header">
          <div class="history-title-wrap">
            <span class="history-title">最近交易紀錄</span>
            <span class="history-subtitle">顯示最新 50 筆交易</span>
          </div>
          <button type="button" class="refresh-btn" onclick="loadRecentTransactions(true)" title="重新整理紀錄">
            <span id="history-refresh-icon">🔄</span>
          </button>
        </div>

        <!-- 三階連動篩選器 -->
        <div class="filter-section">
          <div class="filter-title">🔍 篩選紀錄 (銀行 / 戶頭 / 名目)</div>
          <div class="select-grid">
            <select id="tx-filter-bank" class="select-field" onchange="onTxFilterBankChange()">
              <option value="">全部銀行</option>
            </select>
            <select id="tx-filter-account" class="select-field" onchange="onTxFilterAccountChange()">
              <option value="">全部戶頭</option>
            </select>
          </div>
          <select id="tx-filter-purpose" class="select-field" style="margin-top: 8px;" onchange="renderRecentTransactions()">
            <option value="">全部名目用途</option>
          </select>
        </div>

        <!-- 載入中狀態 -->
        <div id="history-loading" class="history-loading hidden">
          <div class="spinner history-spinner"></div>
          <span>讀取交易紀錄中...</span>
        </div>

        <!-- 卡片清單容器 -->
        <div id="history-list-container" class="history-list-container">
          <!-- 由 JS 動態生成 -->
        </div>
      </div>
    </div>
  </div>

  <!-- Toast 訊息通知 -->
  <div id="toast" class="toast">
    <span id="toast-msg">提示訊息</span>
  </div>

  <script>
    // 全域狀態
    let currentNavTab = 'record'; // 'record' | 'balance' | 'history'
    let currentMode = 'single'; // 'single' | 'transfer' | 'credit'
    let currentType = 'expense'; // 'expense' | 'income'
    let accountRawData = [];
    let creditCardOptions = [];
    let deductPurposes = [];
    let totalNetWorth = 0;
    let recentTransactions = [];
    let isHistoryLoaded = false;

    // 切換頂部大頁籤 (新增記帳 / 餘額查詢 / 查詢紀錄)
    function switchNavTab(tab) {
      currentNavTab = tab;
      document.getElementById('tab-nav-record').classList.toggle('active', tab === 'record');
      document.getElementById('tab-nav-balance').classList.toggle('active', tab === 'balance');
      document.getElementById('tab-nav-history').classList.toggle('active', tab === 'history');

      const panelRecord = document.getElementById('panel-record');
      const panelBalance = document.getElementById('panel-balance');
      const panelHistory = document.getElementById('panel-history');

      panelRecord.classList.toggle('hidden', tab !== 'record');
      panelBalance.classList.toggle('hidden', tab !== 'balance');
      panelHistory.classList.toggle('hidden', tab !== 'history');

      if (tab === 'balance') {
        renderBalanceList();
      } else if (tab === 'history') {
        if (!isHistoryLoaded) {
          loadRecentTransactions();
        }
      }
    }

    // 初始化頁面
    window.addEventListener('DOMContentLoaded', () => {
      // 設定預設日期為今天
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('tx-date').value = today;

      // 載入帳戶選單與餘額
      loadAccountOptions();
    });

    // 格式化金錢顯示
    function formatCurrency(val) {
      const num = Number(val) || 0;
      const isNeg = num < 0;
      const absFormatted = Math.abs(num).toLocaleString('zh-TW');
      return isNeg ? `-$ ${absFormatted}` : `$ ${absFormatted}`;
    }

    // 切換記帳模式 (單筆 / 資金平移 / 刷卡)
    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-single').classList.toggle('active', mode === 'single');
      document.getElementById('tab-transfer').classList.toggle('active', mode === 'transfer');
      document.getElementById('tab-credit').classList.toggle('active', mode === 'credit');

      const singleFields = document.getElementById('single-mode-fields');
      const transferFields = document.getElementById('transfer-mode-fields');
      const creditFields = document.getElementById('credit-mode-fields');
      const btnText = document.getElementById('btn-text');
      const descLabel = document.getElementById('tx-desc-label');
      const descInput = document.getElementById('tx-desc');

      singleFields.classList.toggle('hidden', mode !== 'single');
      transferFields.classList.toggle('hidden', mode !== 'transfer');
      creditFields.classList.toggle('hidden', mode !== 'credit');

      // 單筆模式欄位驗證
      const isSingle = mode === 'single';
      document.getElementById('single-bank').required = isSingle;
      document.getElementById('single-account').required = isSingle;
      document.getElementById('single-purpose').required = isSingle;

      // 平移模式欄位驗證
      const isTransfer = mode === 'transfer';
      document.getElementById('from-bank').required = isTransfer;
      document.getElementById('from-account').required = isTransfer;
      document.getElementById('from-purpose').required = isTransfer;
      document.getElementById('to-bank').required = isTransfer;
      document.getElementById('to-account').required = isTransfer;
      document.getElementById('to-purpose').required = isTransfer;

      // 刷卡模式欄位驗證
      const isCredit = mode === 'credit';
      document.getElementById('cc-bank').required = isCredit;
      document.getElementById('cc-card').required = isCredit;
      document.getElementById('cc-channel').required = isCredit;
      document.getElementById('cc-item').required = isCredit;

      // 動態切換按鈕文字與描述標籤
      if (isSingle) {
        btnText.textContent = '確認寫入交易';
        if (descLabel) descLabel.textContent = '交易項目說明 (選填)';
        if (descInput) descInput.placeholder = '例如：7月利息 / 儲蓄提撥';
      } else if (isTransfer) {
        btnText.textContent = '確認執行平移';
        if (descLabel) descLabel.textContent = '平移原因說明 (選填)';
        if (descInput) descInput.placeholder = '例如：ATM提款轉存 / 活存轉投資';
      } else if (isCredit) {
        btnText.textContent = '確認寫入刷卡紀錄';
        if (descLabel) descLabel.textContent = '備註說明 (選填)';
        if (descInput) descInput.placeholder = '例如：分期付款 / 優惠代碼 / 報帳用';
      }
    }

    // 切換收支類型 (單筆模式)
    function switchType(type) {
      currentType = type;
      document.querySelectorAll('.type-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === type);
      });
    }

    // 呼叫 GAS 後端取得帳戶選單與餘額
    function loadAccountOptions(isRefresh = false) {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => onAccountOptionsLoaded(res, isRefresh))
          .withFailureHandler(onAccountOptionsFailed)
          .getAccountOptions();
      } else {
        console.warn('未檢測到 Google Apps Script 環境');
      }
    }

    function onAccountOptionsLoaded(response, isRefresh = false) {
      const refreshIcon = document.getElementById('refresh-icon');
      if (refreshIcon) refreshIcon.style.animation = 'none';

      if (!response || !response.success) {
        showToast(response ? response.error : '載入帳戶選單失敗', 'error');
        return;
      }

      accountRawData = response.data || [];
      creditCardOptions = response.creditCards || [];
      deductPurposes = response.deductPurposes || [];
      totalNetWorth = response.totalNetWorth || 0;

      const totalElem = document.getElementById('total-net-worth');
      if (totalElem) {
        totalElem.textContent = formatCurrency(totalNetWorth);
      }

      populateBankSelects();
      populateCreditCardSelects();
      populateFilterSelects();
      populateTxFilterSelects();
      renderBalanceList();

      // 更新現有選擇的 Badge 餘額
      onSinglePurposeChange();
      onFromPurposeChange();
      onToPurposeChange();

      if (isRefresh) {
        showToast('餘額與卡片資料已同步最新！', 'success');
      }
    }

    function onAccountOptionsFailed(error) {
      const refreshIcon = document.getElementById('refresh-icon');
      if (refreshIcon) refreshIcon.style.animation = 'none';
      showToast('後端連線失敗: ' + (error.message || error), 'error');
    }

    function refreshBalances() {
      const refreshIcon = document.getElementById('refresh-icon');
      if (refreshIcon) refreshIcon.style.animation = 'spin 0.8s linear infinite';
      loadAccountOptions(true);
    }

    // 填充信用卡卡片選單與扣款名目選單
    function populateCreditCardSelects() {
      const ccBankElem = document.getElementById('cc-bank');
      const ccPurposeElem = document.getElementById('cc-purpose');
      if (!ccBankElem) return;

      const ccBanks = [...new Set(creditCardOptions.map(c => c.bank))];
      ccBankElem.innerHTML = '<option value="">請選擇發卡銀行</option>' +
        ccBanks.map(b => `<option value="${b}">${b}</option>`).join('');

      onCcBankChange();

      if (ccPurposeElem) {
        let purposeHtml = '<option value="">預設扣款戶 / 依卡片設定</option>';
        if (deductPurposes.length > 0) {
          purposeHtml += deductPurposes.map(p => {
            const isDefault = p === '信用卡扣繳戶' ? ' selected' : '';
            return `<option value="${p}"${isDefault}>${p}</option>`;
          }).join('');
        }
        ccPurposeElem.innerHTML = purposeHtml;
      }
    }

    function onCcBankChange() {
      const bankElem = document.getElementById('cc-bank');
      const cardElem = document.getElementById('cc-card');
      if (!bankElem || !cardElem) return;

      const selectedBank = bankElem.value;
      if (!selectedBank) {
        cardElem.innerHTML = '<option value="">請先選擇發卡銀行</option>';
        cardElem.disabled = true;
        return;
      }

      const filteredCards = creditCardOptions.filter(c => c.bank === selectedBank);
      if (filteredCards.length === 0) {
        cardElem.innerHTML = '<option value="">該銀行尚無有效卡片</option>';
        cardElem.disabled = true;
        return;
      }

      cardElem.innerHTML = '<option value="">請選擇卡片</option>' +
        filteredCards.map(c => `<option value="${c.fullName}">${c.fullName}</option>`).join('');
      cardElem.disabled = false;

      // 若該銀行只有一張卡片，自動代入
      if (filteredCards.length === 1) {
        cardElem.value = filteredCards[0].fullName;
      }
    }

    // 填充記帳銀行選單
    function populateBankSelects() {
      const banks = [...new Set(accountRawData.map(item => item.bank))];
      const bankOptionsHTML = '<option value="">請選擇銀行</option>' +
        banks.map(b => `<option value="${b}">${b}</option>`).join('');

      ['single-bank', 'from-bank', 'to-bank'].forEach(id => {
        const elem = document.getElementById(id);
        if (elem) elem.innerHTML = bankOptionsHTML;
      });
    }

    // 填充餘額查詢頁面之篩選選單
    function populateFilterSelects() {
      const filterBankElem = document.getElementById('filter-bank');
      if (!filterBankElem) return;

      const banks = [...new Set(accountRawData.map(item => item.bank))];
      filterBankElem.innerHTML = '<option value="">全部銀行</option>' +
        banks.map(b => `<option value="${b}">${b}</option>`).join('');

      onFilterBankChange();
    }

    function onFilterBankChange() {
      const selectedBank = document.getElementById('filter-bank').value;
      const accountElem = document.getElementById('filter-account');
      const purposeElem = document.getElementById('filter-purpose');
      if (!accountElem || !purposeElem) return;

      purposeElem.innerHTML = '<option value="">全部名目用途</option>';

      if (!selectedBank) {
        accountElem.innerHTML = '<option value="">全部戶頭</option>';
      } else {
        const filteredAccounts = [...new Set(
          accountRawData
            .filter(item => item.bank === selectedBank)
            .map(item => item.account)
        )];
        accountElem.innerHTML = '<option value="">全部戶頭</option>' +
          filteredAccounts.map(a => `<option value="${a}">${a}</option>`).join('');
      }

      onFilterAccountChange();
    }

    function onFilterAccountChange() {
      const selectedBank = document.getElementById('filter-bank').value;
      const selectedAccount = document.getElementById('filter-account').value;
      const purposeElem = document.getElementById('filter-purpose');
      if (!purposeElem) return;

      let filteredItems = accountRawData;
      if (selectedBank) {
        filteredItems = filteredItems.filter(item => item.bank === selectedBank);
      }
      if (selectedAccount) {
        filteredItems = filteredItems.filter(item => item.account === selectedAccount);
      }

      const filteredPurposes = [...new Set(filteredItems.map(item => item.purpose))];
      purposeElem.innerHTML = '<option value="">全部名目用途</option>' +
        filteredPurposes.map(p => `<option value="${p}">${p}</option>`).join('');

      renderBalanceList();
    }

    // 渲染餘額卡片清單
    function renderBalanceList() {
      const container = document.getElementById('balance-list-container');
      if (!container) return;

      const bankFilter = document.getElementById('filter-bank') ? document.getElementById('filter-bank').value : '';
      const accountFilter = document.getElementById('filter-account') ? document.getElementById('filter-account').value : '';
      const purposeFilter = document.getElementById('filter-purpose') ? document.getElementById('filter-purpose').value : '';

      let list = accountRawData;

      if (bankFilter) {
        list = list.filter(item => item.bank === bankFilter);
      }
      if (accountFilter) {
        list = list.filter(item => item.account === accountFilter);
      }
      if (purposeFilter) {
        list = list.filter(item => item.purpose === purposeFilter);
      }

      if (list.length === 0) {
        container.innerHTML = '<div class="empty-state">尚無符合條件的帳戶餘額資料</div>';
        return;
      }

      container.innerHTML = list.map(item => {
        const isNeg = Number(item.balance) < 0;
        return `
          <div class="balance-item-card">
            <div class="balance-item-left">
              <div class="balance-item-bank">🏦 ${item.bank}</div>
              <div class="balance-item-meta">
                <span class="tag-account">${item.account}</span>
                <span class="tag-purpose">${item.purpose}</span>
              </div>
            </div>
            <div class="balance-item-right">
              <div class="balance-item-val ${isNeg ? 'negative' : ''}">${formatCurrency(item.balance)}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 填充查詢紀錄頁面之篩選選單
    function populateTxFilterSelects() {
      const filterBankElem = document.getElementById('tx-filter-bank');
      if (!filterBankElem) return;

      const currentSelectedBank = filterBankElem.value;
      const banks = [...new Set(accountRawData.map(item => item.bank))];
      filterBankElem.innerHTML = '<option value="">全部銀行</option>' +
        banks.map(b => `<option value="${b}">${b}</option>`).join('');

      if (banks.includes(currentSelectedBank)) {
        filterBankElem.value = currentSelectedBank;
      }

      onTxFilterBankChange();
    }

    function onTxFilterBankChange() {
      const selectedBank = document.getElementById('tx-filter-bank') ? document.getElementById('tx-filter-bank').value : '';
      const accountElem = document.getElementById('tx-filter-account');
      const purposeElem = document.getElementById('tx-filter-purpose');
      if (!accountElem || !purposeElem) return;

      const currentSelectedAccount = accountElem.value;
      purposeElem.innerHTML = '<option value="">全部名目用途</option>';

      if (!selectedBank) {
        accountElem.innerHTML = '<option value="">全部戶頭</option>';
      } else {
        const filteredAccounts = [...new Set(
          accountRawData
            .filter(item => item.bank === selectedBank)
            .map(item => item.account)
        )];
        accountElem.innerHTML = '<option value="">全部戶頭</option>' +
          filteredAccounts.map(a => `<option value="${a}">${a}</option>`).join('');

        if (filteredAccounts.includes(currentSelectedAccount)) {
          accountElem.value = currentSelectedAccount;
        }
      }

      onTxFilterAccountChange();
    }

    function onTxFilterAccountChange() {
      const selectedBank = document.getElementById('tx-filter-bank') ? document.getElementById('tx-filter-bank').value : '';
      const selectedAccount = document.getElementById('tx-filter-account') ? document.getElementById('tx-filter-account').value : '';
      const purposeElem = document.getElementById('tx-filter-purpose');
      if (!purposeElem) return;

      const currentSelectedPurpose = purposeElem.value;

      let filteredItems = accountRawData;
      if (selectedBank) {
        filteredItems = filteredItems.filter(item => item.bank === selectedBank);
      }
      if (selectedAccount) {
        filteredItems = filteredItems.filter(item => item.account === selectedAccount);
      }

      const filteredPurposes = [...new Set(filteredItems.map(item => item.purpose))];
      purposeElem.innerHTML = '<option value="">全部名目用途</option>' +
        filteredPurposes.map(p => `<option value="${p}">${p}</option>`).join('');

      if (filteredPurposes.includes(currentSelectedPurpose)) {
        purposeElem.value = currentSelectedPurpose;
      }

      renderRecentTransactions();
    }

    // ================= 動態連動觸發邏輯 =================
    function onSingleBankChange() {
      const bank = document.getElementById('single-bank').value;
      updateAccountOptions(bank, 'single-account', 'single-purpose');
    }

    function onSingleAccountChange() {
      const bank = document.getElementById('single-bank').value;
      const account = document.getElementById('single-account').value;
      updatePurposeOptions(bank, account, 'single-purpose');
    }

    function onFromBankChange() {
      const bank = document.getElementById('from-bank').value;
      updateAccountOptions(bank, 'from-account', 'from-purpose');
    }

    function onFromAccountChange() {
      const bank = document.getElementById('from-bank').value;
      const account = document.getElementById('from-account').value;
      updatePurposeOptions(bank, account, 'from-purpose');
    }

    function onToBankChange() {
      const bank = document.getElementById('to-bank').value;
      updateAccountOptions(bank, 'to-account', 'to-purpose');
    }

    function onToAccountChange() {
      const bank = document.getElementById('to-bank').value;
      const account = document.getElementById('to-account').value;
      updatePurposeOptions(bank, account, 'to-purpose');
    }

    function updateAccountOptions(selectedBank, accountElemId, purposeElemId) {
      const accountElem = document.getElementById(accountElemId);
      const purposeElem = document.getElementById(purposeElemId);

      purposeElem.innerHTML = '<option value="">選擇名目用途</option>';
      purposeElem.disabled = true;

      if (purposeElemId === 'single-purpose') onSinglePurposeChange();
      if (purposeElemId === 'from-purpose') onFromPurposeChange();
      if (purposeElemId === 'to-purpose') onToPurposeChange();

      if (!selectedBank) {
        accountElem.innerHTML = '<option value="">選擇戶頭</option>';
        accountElem.disabled = true;
        return;
      }

      const filteredAccounts = [...new Set(
        accountRawData
          .filter(item => item.bank === selectedBank)
          .map(item => item.account)
      )];

      accountElem.innerHTML = '<option value="">選擇戶頭</option>' +
        filteredAccounts.map(a => `<option value="${a}">${a}</option>`).join('');
      accountElem.disabled = false;
    }

    function updatePurposeOptions(selectedBank, selectedAccount, purposeElemId) {
      const purposeElem = document.getElementById(purposeElemId);

      if (!selectedBank || !selectedAccount) {
        purposeElem.innerHTML = '<option value="">選擇名目用途</option>';
        purposeElem.disabled = true;
      } else {
        const filteredPurposes = [...new Set(
          accountRawData
            .filter(item => item.bank === selectedBank && item.account === selectedAccount)
            .map(item => item.purpose)
        )];

        purposeElem.innerHTML = '<option value="">選擇名目用途</option>' +
          filteredPurposes.map(p => `<option value="${p}">${p}</option>`).join('');
        purposeElem.disabled = false;
      }

      if (purposeElemId === 'single-purpose') onSinglePurposeChange();
      if (purposeElemId === 'from-purpose') onFromPurposeChange();
      if (purposeElemId === 'to-purpose') onToPurposeChange();
    }

    // 即時動態餘額 Badge 觸發邏輯
    function onSinglePurposeChange() {
      const bank = document.getElementById('single-bank').value;
      const account = document.getElementById('single-account').value;
      const purpose = document.getElementById('single-purpose').value;
      updateBalanceBadge(bank, account, purpose, 'single-balance-badge', 'single-balance-val');
    }

    function onFromPurposeChange() {
      const bank = document.getElementById('from-bank').value;
      const account = document.getElementById('from-account').value;
      const purpose = document.getElementById('from-purpose').value;
      updateBalanceBadge(bank, account, purpose, 'from-balance-badge', 'from-balance-val');
    }

    function onToPurposeChange() {
      const bank = document.getElementById('to-bank').value;
      const account = document.getElementById('to-account').value;
      const purpose = document.getElementById('to-purpose').value;
      updateBalanceBadge(bank, account, purpose, 'to-balance-badge', 'to-balance-val');
    }

    function updateBalanceBadge(bank, account, purpose, badgeId, valId) {
      const badgeElem = document.getElementById(badgeId);
      const valElem = document.getElementById(valId);
      if (!badgeElem || !valElem) return;

      if (!bank || !account || !purpose) {
        badgeElem.classList.add('hidden');
        return;
      }

      const match = accountRawData.find(item => item.bank === bank && item.account === account && item.purpose === purpose);
      if (match) {
        valElem.textContent = formatCurrency(match.balance);
        valElem.className = `balance-badge-val ${Number(match.balance) < 0 ? 'negative' : ''}`;
        badgeElem.classList.remove('hidden');
      } else {
        badgeElem.classList.add('hidden');
      }
    }

    // 表單送出處理
    function handleFormSubmit(event) {
      event.preventDefault();

      const rawDate = document.getElementById('tx-date').value;
      const date = rawDate ? rawDate.replace(/-/g, '/') : '';
      const amount = document.getElementById('tx-amount').value;
      const description = document.getElementById('tx-desc').value.trim();

      // ================= 信用卡模式 =================
      if (currentMode === 'credit') {
        const ccBank = document.getElementById('cc-bank').value;
        const ccCard = document.getElementById('cc-card').value;
        const ccChannel = document.getElementById('cc-channel').value;
        const ccItem = document.getElementById('cc-item').value.trim();
        const ccPurpose = document.getElementById('cc-purpose').value;

        if (!ccBank) {
          showToast('請選擇發卡銀行', 'error');
          return;
        }
        if (!ccCard) {
          showToast('請選擇卡片', 'error');
          return;
        }
        if (!ccItem) {
          showToast('請選擇消費項目', 'error');
          return;
        }
        if (!amount || Number(amount) <= 0) {
          showToast('請輸入大於 0 的有效金額', 'error');
          return;
        }

        const payload = {
          date: date,
          bank: ccBank,
          card: ccCard,
          item: ccItem,
          channel: ccChannel,
          amount: amount,
          purpose: ccPurpose,
          note: description
        };

        setSubmittingState(true);

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(onRecordCreditSuccess)
            .withFailureHandler(onRecordFailed)
            .recordCreditCardTransaction(payload);
        } else {
          setTimeout(() => {
            onRecordCreditSuccess({
              success: true,
              message: `（模擬）刷卡紀錄已成功寫入！金額：$${amount}（${ccCard} - ${ccItem}）`
            });
          }, 1000);
        }
        return;
      }

      // ================= 單筆記帳 / 資金平移模式 =================
      let payload = {
        mode: currentMode,
        date: date,
        amount: amount,
        description: description
      };

      if (currentMode === 'single') {
        payload.type = currentType;
        payload.bank = document.getElementById('single-bank').value;
        payload.account = document.getElementById('single-account').value;
        payload.purpose = document.getElementById('single-purpose').value;
      } else {
        payload.fromBank = document.getElementById('from-bank').value;
        payload.fromAccount = document.getElementById('from-account').value;
        payload.fromPurpose = document.getElementById('from-purpose').value;
        payload.toBank = document.getElementById('to-bank').value;
        payload.toAccount = document.getElementById('to-account').value;
        payload.toPurpose = document.getElementById('to-purpose').value;

        if (payload.fromBank === payload.toBank &&
            payload.fromAccount === payload.toAccount &&
            payload.fromPurpose === payload.toPurpose) {
          showToast('轉出與轉入帳戶不能完全相同', 'error');
          return;
        }
      }

      setSubmittingState(true);

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onRecordSuccess)
          .withFailureHandler(onRecordFailed)
          .recordTransaction(payload);
      } else {
        setTimeout(() => {
          onRecordSuccess({ success: true, message: '（模擬）交易已成功寫入！' });
        }, 1000);
      }
    }

    function onRecordCreditSuccess(response) {
      setSubmittingState(false);
      if (response && response.success) {
        showToast(response.message || '刷卡紀錄已成功寫入！', 'success');
        document.getElementById('tx-amount').value = '';
        document.getElementById('tx-desc').value = '';
        document.getElementById('cc-item').value = '';
      } else {
        showToast(response ? response.error : '寫入失敗', 'error');
      }
    }

    function onRecordSuccess(response) {
      setSubmittingState(false);
      if (response && response.success) {
        showToast(response.message || '寫入成功！', 'success');
        document.getElementById('tx-amount').value = '';
        document.getElementById('tx-desc').value = '';

        // 交易成功後自動重新載入最新餘額
        loadAccountOptions();

        // 若已載入過交易紀錄，同步更新最新清單
        if (isHistoryLoaded) {
          loadRecentTransactions();
        }
      } else {
        showToast(response ? response.error : '寫入失敗', 'error');
      }
    }

    // 呼叫 GAS 後端取得最近交易紀錄 (預設 50 筆)
    function loadRecentTransactions(isRefresh = false) {
      const refreshIcon = document.getElementById('history-refresh-icon');
      const loadingElem = document.getElementById('history-loading');
      const listContainer = document.getElementById('history-list-container');

      if (refreshIcon) refreshIcon.style.animation = 'spin 0.8s linear infinite';
      if (loadingElem) loadingElem.classList.remove('hidden');
      if (listContainer) listContainer.classList.add('hidden');

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => onRecentTransactionsLoaded(res, isRefresh))
          .withFailureHandler(onRecentTransactionsFailed)
          .getRecentTransactions(50);
      } else {
        // 本地開發測試模擬資料
        setTimeout(() => {
          onRecentTransactionsLoaded({
            success: true,
            data: [
              { date: '2026/10/31', bank: '永豐', account: '大戶', purpose: '生活預備金', description: '利息存入', type: 'income', amount: 350 },
              { date: '2026/10/30', bank: '臺銀', account: '數位', purpose: '日常花銷', description: '超市採買', type: 'expense', amount: 1280 }
            ]
          }, isRefresh);
        }, 500);
      }
    }

    function onRecentTransactionsLoaded(response, isRefresh = false) {
      const refreshIcon = document.getElementById('history-refresh-icon');
      const loadingElem = document.getElementById('history-loading');
      const listContainer = document.getElementById('history-list-container');

      if (refreshIcon) refreshIcon.style.animation = 'none';
      if (loadingElem) loadingElem.classList.add('hidden');
      if (listContainer) listContainer.classList.remove('hidden');

      if (!response || !response.success) {
        showToast(response ? response.error : '載入交易紀錄失敗', 'error');
        return;
      }

      recentTransactions = response.data || [];
      isHistoryLoaded = true;
      if (accountRawData.length > 0) {
        populateTxFilterSelects();
      }
      renderRecentTransactions();

      if (isRefresh) {
        showToast('交易紀錄已更新至最新狀態！', 'success');
      }
    }

    function onRecentTransactionsFailed(error) {
      const refreshIcon = document.getElementById('history-refresh-icon');
      const loadingElem = document.getElementById('history-loading');
      const listContainer = document.getElementById('history-list-container');

      if (refreshIcon) refreshIcon.style.animation = 'none';
      if (loadingElem) loadingElem.classList.add('hidden');
      if (listContainer) listContainer.classList.remove('hidden');

      showToast('載入紀錄失敗: ' + (error.message || error), 'error');
    }

    // 渲染最近交易紀錄卡片清單
    function renderRecentTransactions() {
      const container = document.getElementById('history-list-container');
      if (!container) return;

      if (!recentTransactions || recentTransactions.length === 0) {
        container.innerHTML = '<div class="empty-state">尚無任何交易紀錄</div>';
        return;
      }

      const bankFilter = document.getElementById('tx-filter-bank') ? document.getElementById('tx-filter-bank').value : '';
      const accountFilter = document.getElementById('tx-filter-account') ? document.getElementById('tx-filter-account').value : '';
      const purposeFilter = document.getElementById('tx-filter-purpose') ? document.getElementById('tx-filter-purpose').value : '';

      let list = recentTransactions;

      if (bankFilter) {
        list = list.filter(item => item.bank === bankFilter);
      }
      if (accountFilter) {
        list = list.filter(item => item.account === accountFilter);
      }
      if (purposeFilter) {
        list = list.filter(item => item.purpose === purposeFilter);
      }

      if (list.length === 0) {
        container.innerHTML = '<div class="empty-state">尚無符合條件的交易紀錄</div>';
        return;
      }

      container.innerHTML = list.map(tx => {
        const isIncome = tx.type === 'income';
        const typeClass = isIncome ? 'income' : 'expense';
        const typeLabel = isIncome ? '收入 (+)' : '支出 (-)';
        const sign = isIncome ? '+' : '-';
        const formattedAmount = `${sign}$ ${Number(tx.amount || 0).toLocaleString('zh-TW')}`;

        return `
          <div class="tx-card">
            <div class="tx-card-header">
              <div class="tx-date-badge">
                <span>📅 ${tx.date || '---'}</span>
                <span class="tx-type-tag ${typeClass}">${typeLabel}</span>
              </div>
              <div class="tx-amount ${typeClass}">${formattedAmount}</div>
            </div>
            <div class="tx-card-body">
              <div class="tx-account-row">
                <span>🏦 ${tx.bank}</span>
                <span class="tag-account">${tx.account}</span>
                <span class="tag-purpose">${tx.purpose}</span>
              </div>
              ${tx.description ? `<div class="tx-desc-row">💬 ${escapeHtml(tx.description)}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // HTML 跳脫字元防護
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function onRecordFailed(error) {
      setSubmittingState(false);
      showToast('寫入失敗: ' + (error.message || error), 'error');
    }

    function setSubmittingState(isSubmitting) {
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      submitBtn.disabled = isSubmitting;
      if (isSubmitting) {
        btnText.textContent = '處理中...';
        btnSpinner.classList.remove('hidden');
      } else {
        if (currentMode === 'credit') {
          btnText.textContent = '確認寫入刷卡紀錄';
        } else if (currentMode === 'transfer') {
          btnText.textContent = '確認執行平移';
        } else {
          btnText.textContent = '確認寫入交易';
        }
        btnSpinner.classList.add('hidden');
      }
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');

      toastMsg.textContent = message;
      toast.className = `toast ${type} show`;

      setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }
  </script>
</body>
</html>
