<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- 嚴格禁止所有搜尋引擎與爬蟲索引/收錄 -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  
  <title>Irrigation_Core 資金調度</title>
  
  <!-- 感覺會賺錢的 App 圖示與 Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.png">

  <!-- iOS / Android 全螢幕 PWA 體驗設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Irrigation">
  <meta name="theme-color" content="#0f172a">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    /* 滿版 Iframe 包裹層 */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* 設定 GAS 網址之 Modal */
    .setup-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      color: #f8fafc;
      text-align: center;
    }

    .setup-card {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .app-icon-preview {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin: 0 auto 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(234, 179, 8, 0.3);
      display: block;
    }

    .setup-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #f59e0b, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .setup-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 16px;
    }

    .input-field:focus {
      border-color: #6366f1;
    }

    .btn-save {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      transition: all 0.2s ease;
    }

    .btn-save:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .hidden {
      display: none !important;
    }

    /* 懸浮小重設按鈕 */
    .reset-btn {
      position: fixed;
      bottom: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      background: rgba(15, 23, 42, 0.6);
      color: #64748b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.3;
      transition: opacity 0.2s ease;
      z-index: 999;
    }

    .reset-btn:hover {
      opacity: 1;
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <!-- 滿版 Iframe 載入區 -->
  <iframe id="app-frame" class="hidden" src="about:blank" allow="geolocation; microphone; camera"></iframe>

  <!-- 第一次設定 GAS 網址區域 -->
  <div id="setup-area" class="setup-container">
    <div class="setup-card">
      <img src="apple-touch-icon.png" alt="Irrigation Icon" class="app-icon-preview">
      <h1 class="setup-title">Irrigation_Core</h1>
      <p class="setup-desc">無標籤獨立 Web App 包裹層。<br>請貼上您的 Google Apps Script 部署網址 (Web App URL)：</p>
      <form onsubmit="saveGasUrl(event)">
        <input type="url" id="gas-url-input" class="input-field" placeholder="https://script.google.com/macros/s/.../exec" required>
        <button type="submit" class="btn-save">開啟專屬無標籤系統</button>
      </form>
    </div>
  </div>

  <!-- 重設設定按鈕 -->
  <div id="reset-trigger" class="reset-btn hidden" title="重設 GAS 網址" onclick="resetGasUrl()">⚙️</div>

  <script>
    const STORAGE_KEY = 'IRRIGATION_CORE_GAS_URL';

    window.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem(STORAGE_KEY);
      if (savedUrl) {
        launchIframe(savedUrl);
      }
    });

    function saveGasUrl(event) {
      event.preventDefault();
      const url = document.getElementById('gas-url-input').value.trim();
      if (url) {
        localStorage.setItem(STORAGE_KEY, url);
        launchIframe(url);
      }
    }

    function launchIframe(url) {
      const iframe = document.getElementById('app-frame');
      const setupArea = document.getElementById('setup-area');
      const resetTrigger = document.getElementById('reset-trigger');

      iframe.src = url;
      iframe.classList.remove('hidden');
      setupArea.classList.add('hidden');
      resetTrigger.classList.remove('hidden');
    }

    function resetGasUrl() {
      if (confirm('確定要重新設定 GAS 部署網址嗎？')) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    }
  </script>
</body>
</html>
